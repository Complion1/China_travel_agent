defaults:
  pace: normal
  transport_preference: public_transit_and_taxi
  hotel_preference: convenient_transport_mid_range
  max_major_stops_per_day:
    relaxed: 3
    normal: 4
    intense: 6

required_fields:
  - city
  - days

day_rules:
  arrival_day:
    avoid_far_suburbs: true
    prefer_light_route: true
  departure_day:
    avoid_far_suburbs: true
    reserve_departure_buffer_hours: 3
  meal_rules:
    lunch_near_previous_or_next_stop: true
    dinner_near_evening_area_or_hotel: true

validation:
  max_transit_minutes_between_major_stops:
    relaxed: 45
    normal: 60
    intense: 90
  require_weather_check: true
  require_route_check_when_arrival_place_exists: true
