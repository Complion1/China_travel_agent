name: china-travel-agent

x-agent-environment: &agent-environment
  TZ: Asia/Shanghai
  HOME: /tmp
  XDG_CACHE_HOME: /tmp/.cache
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

x-agent-security: &agent-security
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m
  security_opt:
    - no-new-privileges:true

x-agent-build: &agent-build
  context: .
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}

services:
  runtime:
    <<: *agent-security
    image: china-travel-agent:local
    build:
      <<: *agent-build
      target: runtime
    environment:
      <<: *agent-environment
      BAIDU_MAPS_API_KEY: ${BAIDU_MAPS_API_KEY:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-china_travel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-china_travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}

  artifact-migrate:
    <<: *agent-security
    profiles: ["production"]
    image: china-travel-agent:local
    build:
      <<: *agent-build
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agent-environment
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-china_travel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-china_travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    command:
      - alembic
      - -c
      - /workspace/app/artifact_persistence/alembic.ini
      - upgrade
      - head

  durable-migrate:
    <<: *agent-security
    profiles: ["production"]
    image: china-travel-agent:local
    build:
      <<: *agent-build
      target: runtime
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      artifact-migrate:
        condition: service_completed_successfully
    environment:
      <<: *agent-environment
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-china_travel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-china_travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    command: ["python", "-m", "app.durable_execution.migrate"]

  test:
    <<: *agent-security
    profiles: ["test"]
    image: china-travel-agent:test
    build:
      <<: *agent-build
      target: test
    environment: *agent-environment
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

  live-test:
    <<: *agent-security
    profiles: ["live"]
    image: china-travel-agent:test
    build:
      <<: *agent-build
      target: test
    environment: *agent-environment
    command:
      - python
      - -m
      - pytest
      - -q
      - -p
      - no:cacheprovider
      - tests/live/llm_runtime
      - tests/live/requirement_extraction

  baidu-map-live-test:
    <<: *agent-security
    profiles: ["live"]
    image: china-travel-agent:module06-live-${MODULE06_LIVE_IMAGE_TAG:-not-authorized}
    build:
      <<: *agent-build
      target: test
    environment:
      TZ: Asia/Shanghai
      HOME: /tmp/module06-home
      XDG_CACHE_HOME: /tmp/module06-cache
      BAIDU_MAPS_API_KEY: ${BAIDU_MAPS_API_KEY:-__BAIDU_MAPS_API_KEY_REQUIRED__}
    cap_drop:
      - ALL

  module09-live-test:
    <<: *agent-security
    profiles: ["live"]
    image: china-travel-agent:module09-live-${MODULE09_LIVE_IMAGE_TAG:-local}
    build:
      <<: *agent-build
      target: test
    environment:
      TZ: Asia/Shanghai
      HOME: /tmp/module09-home
      XDG_CACHE_HOME: /tmp/module09-cache
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-__DEEPSEEK_API_KEY_REQUIRED__}
      BAIDU_MAPS_API_KEY: ${BAIDU_MAPS_API_KEY:-__BAIDU_MAPS_API_KEY_REQUIRED__}
    cap_drop:
      - ALL
    command:
      - python
      - -m
      - pytest
      - -q
      - -p
      - no:cacheprovider
      - tests/live/itinerary_planning/test_live_planning.py

  module070809-live-test:
    <<: *agent-security
    profiles: ["live"]
    image: china-travel-agent:module070809-live-${MODULE070809_LIVE_IMAGE_TAG:-local}
    build:
      <<: *agent-build
      target: test
    environment:
      TZ: Asia/Shanghai
      HOME: /tmp/module070809-home
      XDG_CACHE_HOME: /tmp/module070809-cache
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-__DEEPSEEK_API_KEY_REQUIRED__}
      BAIDU_MAPS_API_KEY: ${BAIDU_MAPS_API_KEY:-__BAIDU_MAPS_API_KEY_REQUIRED__}
      MODULE070809_LIVE_RUNS: "1"
    cap_drop:
      - ALL
    command:
      - python
      - -m
      - pytest
      - -q
      - -s
      - -p
      - no:cacheprovider
      - tests/live/travel_pipeline/test_live_modules_07_08_09.py

  postgres:
    profiles: ["production"]
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-china_travel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-china_travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
