<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>旅行规划 · 历史任务</title>
  <link rel="stylesheet" href="/static/site.css?v=m24-3">
  <script src="/static/ui.js?v=m24-3" defer></script>
  <script src="/static/guide.js?v=m24-3" defer></script>
  <script src="/static/process.js?v=m24-3" defer></script>
  <script src="/static/app.js?v=m24-3" defer></script>
</head>
<body data-page="history">
<header class="site-header">
  <a class="site-brand" href="/"><span class="brand-mark" aria-hidden="true">旅</span>中国旅行规划</a>
  <nav aria-label="主导航"><a href="/">开始规划</a><a href="/samples">完整样例</a><a href="/history" aria-current="page">我的任务</a></nav>
</header>
<main>
  <div class="page-heading heading-with-action">
    <div><p class="eyebrow">旅行记录</p><h1>我的任务</h1><p class="page-description">查看规划进度，继续需要确认的步骤，或阅读已经完成的攻略。</p></div>
    <a class="button" href="/">新建任务<span aria-hidden="true"> →</span></a>
  </div>
  <p class="context-note">仅显示当前浏览器的任务，每页最多 20 条。Cookie 从首次签发起 30 天有效；换设备、清除 Cookie 或到期后无法找回。</p>
  <p id="message" role="status" aria-live="polite"></p>
  <div class="history-tools"><label for="history-filter">筛选当前页</label><select id="history-filter"><option value="all">全部任务</option><option value="executing">正在执行</option><option value="waiting">等待操作</option><option value="completed">已完成</option><option value="failed">未完成</option><option value="cancelled">已取消</option></select></div>
  <p id="history-state" class="muted" role="status">正在读取当前页…</p>
  <button id="history-retry" class="secondary" type="button" hidden>重新读取本页</button>
  <div id="history-list" class="history-list" aria-label="任务列表"></div>
  <button id="history-next" class="secondary" hidden>下一页</button>
</main>
<footer>刷新或关闭页面不会取消任务。需要取消时，请进入对应任务操作。</footer>
</body>
</html>
