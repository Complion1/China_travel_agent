<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国旅行规划 · 开始体验</title><link rel="stylesheet" href="/static/site.css"><script src="/static/app.js" defer></script></head><body data-page="home"><header><a href="/">中国旅行规划</a><nav><a href="/samples">完整样例</a><a href="/history">我的任务</a></nav></header><main><p class="eyebrow">旅行规划 Agent · 可交互体验</p><h1>说说你想怎样旅行</h1><p>确认需求、选择酒店，然后查看完整攻略。真实规划会消耗公共体验额度；也可随时阅读公开样例。</p><form id="start-form"><label for="trip-input">旅行需求</label><textarea id="trip-input" maxlength="8000" required rows="9">我想去杭州，轻松游览 3 天，两位成人，从上海出发。希望有自然景色、当地美食，酒店交通方便。请帮我进一步确认出行日期和预算。</textarea><label class="check"><input id="date-confirm" type="checkbox" required>我已核对上面的出行日期与需求；尚未确定的内容请继续询问。</label><button id="start-button" type="submit">开始规划</button></form><p id="admission" class="muted">正在读取体验额度…</p><p id="message" role="status" aria-live="polite"></p><button id="query-request" type="button" hidden>查询原请求</button><aside><h2>先看看效果</h2><p>完整样例为明确标注的离线合成内容，随时可读。</p><a class="button secondary" href="/samples">阅读完整样例</a></aside></main><footer>匿名任务仅由当前浏览器 Cookie 关联，有效期 30 天。</footer></body></html>
